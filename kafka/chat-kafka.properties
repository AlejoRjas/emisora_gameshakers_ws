# Kafka de un solo nodo (modo KRaft, sin ZooKeeper) para GameShakers Chat.
# Basado en config/server.properties de Kafka 4.4.0, con dos cambios:
#  1) Escucha solo en este equipo (localhost): el servidor de chat corre aquí mismo
#     y así Kafka no queda expuesto a la red.
#  2) Los datos se guardan en la carpeta "datos" junto a este archivo.

process.roles=broker,controller
node.id=1
controller.quorum.bootstrap.servers=localhost:9093
listeners=PLAINTEXT://localhost:9092,CONTROLLER://localhost:9093
inter.broker.listener.name=PLAINTEXT
advertised.listeners=PLAINTEXT://localhost:9092,CONTROLLER://localhost:9093
controller.listener.names=CONTROLLER
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

log.dirs=datos
num.partitions=1
offsets.topic.replication.factor=1
share.coordinator.state.topic.replication.factor=1
share.coordinator.state.topic.min.isr=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
log.retention.hours=24
