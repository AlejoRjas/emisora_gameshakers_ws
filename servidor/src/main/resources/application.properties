spring.application.name=gameshakers-chat
# Render (y otros servicios) indican el puerto en la variable PORT; en tu equipo se usa 8080
server.port=${PORT:8080}
# Kafka es opcional. Vacío = los mensajes se reparten en memoria.
# Ejemplo local: java -jar servidor.jar --chat.kafka.servidores=localhost:9092
chat.kafka.servidores=${KAFKA_SERVIDORES:}
chat.max-usuarios-por-sala=50
spring.main.banner-mode=off
logging.level.org.apache.kafka=WARN
